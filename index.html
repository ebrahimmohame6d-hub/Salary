<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Attend & Salary — METI</title>
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;background:linear-gradient(135deg,#1e3a72 0%,#2a5298 100%);overflow:hidden;font-family:'Segoe UI',Tahoma,sans-serif}
  html::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.12) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:linear-gradient(135deg,#1e3a72 0%,#2a5298 100%);z-index:2;transition:opacity .5s ease}
  #loader.hide{opacity:0;pointer-events:none}
  .loader-card{background:#fff;border-radius:22px;padding:36px 28px;width:90%;max-width:360px;text-align:center;box-shadow:0 16px 56px rgba(0,0,0,0.25);animation:fadeUp 0.45s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .loader-avatar{width:64px;height:64px;border-radius:50%;background:#dde8f8;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
  .loader-avatar img{width:100%;height:100%;object-fit:cover}
  .loader-card h2{font-size:20px;font-weight:800;color:#1a2a4a;margin-bottom:6px;font-family:'Segoe UI',sans-serif}
  .loader-online{display:inline-flex;align-items:center;gap:5px;background:#e6f9ef;border:1.5px solid #2cb87a;color:#1a8a55;border-radius:30px;padding:3px 12px;font-size:11px;font-weight:700;margin-bottom:6px}
  .loader-online::before{content:'';width:7px;height:7px;border-radius:50%;background:#2cb87a;display:inline-block;animation:livePulse 2s infinite}
  @keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}
  .loader-sub{font-size:12px;color:#5a6a84;margin-bottom:22px}
  .spin{width:34px;height:34px;border:3px solid rgba(20,224,180,0.2);border-top-color:#14e0b4;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loader p{color:rgba(255,255,255,0.7);font-size:13px;letter-spacing:.05em;margin-top:4px}
  #app-frame{position:fixed;inset:0;width:100%;height:100%;border:none;display:block;opacity:0;transition:opacity .4s ease}
  #app-frame.show{opacity:1}
</style>
<base target="_blank">
</head>
<body>

<div id="loader">
  <div class="loader-card">
    <div class="loader-avatar"><img src="https://i.ibb.co/WpxRj6z9/Screenshot-2026-03-31-220317.png" alt="Logo"></div>
    <h2>Attend & Salary</h2>
    <div class="loader-online">متصل</div>
    <p class="loader-sub">جاري تحميل النظام...</p>
    <div class="spin"></div>
  </div>
</div>

<iframe id="app-frame"
  src="https://script.google.com/macros/s/AKfycbye7KFKphubufC72h2FmsErDHC6pwWy6-1dZ2rpO5fRiSehTZb4y-acjTDilUhZf7FG/exec"
  allow="clipboard-write"
  onload="document.getElementById('loader').classList.add('hide');document.getElementById('app-frame').classList.add('show')">
</iframe>

</body>
</html>
